openapi: 3.0.0
info:
  title: Powerhouse WordPress Plugin API
  version: 3.3.46
  description: |
    Powerhouse 核心外掛 REST API，namespace: v2/powerhouse
    Base URL: /wp-json/v2/powerhouse

servers:
  - url: /wp-json/v2/powerhouse
    description: WordPress REST API (Powerhouse namespace)

paths:

  # ─────────────────────────────────────────
  # Settings
  # ─────────────────────────────────────────

  /options:
    get:
      operationId: getOptions
      summary: 查詢設定
      tags: [Settings]
      responses:
        '200':
          description: 成功回傳所有設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOptionsResponse'

    post:
      operationId: updateOptions
      summary: 更新設定
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOptionsRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOptionsResponse'

  /options/upload:
    get:
      operationId: getUploadOptions
      summary: 查詢上傳選項（允許的 MIME 類型）
      tags: [Settings]
      responses:
        '200':
          description: 成功回傳允許的 MIME 類型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOptionsResponse'

  # ─────────────────────────────────────────
  # License Code
  # ─────────────────────────────────────────

  /lc:
    get:
      operationId: getLicenseCodes
      summary: 查詢授權碼狀態
      tags: [LicenseCode]
      responses:
        '200':
          description: 成功回傳所有授權碼狀態列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LicenseCodeStatus'

  /lc/activate:
    post:
      operationId: activateLicenseCode
      summary: 啟用授權碼
      tags: [LicenseCode]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateLCRequest'
      responses:
        '200':
          description: 啟用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateLCResponse'
        '500':
          description: 啟用失敗（CloudAPI 回傳 401 或例外）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lc/deactivate:
    post:
      operationId: deactivateLicenseCode
      summary: 棄用授權碼
      tags: [LicenseCode]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateLCRequest'
      responses:
        '200':
          description: 棄用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateLCResponse'
        '500':
          description: CloudAPI 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lc/invalidate:
    post:
      operationId: invalidateLicenseCodeCache
      summary: 清除授權碼快取（公開端點，供 CloudAPI 主動回呼）
      tags: [LicenseCode]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidateLCRequest'
      responses:
        '200':
          description: 清除快取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidateLCResponse'
        '400':
          description: product_slug 不能為空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─────────────────────────────────────────
  # Limit（存取權限）
  # ─────────────────────────────────────────

  /limit/grant-users:
    post:
      operationId: grantUsersAccess
      summary: 授權用戶存取項目
      tags: [Limit]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrantUsersRequest'
      responses:
        '200':
          description: 授權成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantUsersResponse'
        '400':
          description: 缺少必要參數
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: user_ids 或 item_ids 為空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /limit/update-users:
    post:
      operationId: updateUsersAccess
      summary: 更新用戶存取期限
      tags: [Limit]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUsersRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUsersResponse'
        '400':
          description: 缺少必要參數
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /limit/revoke-users:
    post:
      operationId: revokeUsersAccess
      summary: 撤銷用戶存取
      tags: [Limit]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeUsersRequest'
      responses:
        '200':
          description: 撤銷成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeUsersResponse'
        '400':
          description: 缺少必要參數
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─────────────────────────────────────────
  # Posts
  # ─────────────────────────────────────────

  /posts:
    get:
      operationId: getPosts
      summary: 查詢文章列表
      tags: [Post]
      parameters:
        - name: post_type
          in: query
          schema:
            type: string
            example: post
        - name: posts_per_page
          in: query
          schema:
            type: integer
            example: 20
        - name: paged
          in: query
          schema:
            type: integer
            example: 1
        - name: post_parent
          in: query
          schema:
            type: string
            example: "0"
          description: 傳入 "unset" 表示不限父文章
        - name: post_status
          in: query
          schema:
            type: string
            example: any
        - name: depth
          in: query
          schema:
            type: integer
            example: 0
          description: 取得子文章的巢狀層數，0 表示不取子文章
        - name: meta_keys[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: with_description
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 成功回傳文章列表
          headers:
            X-WP-Total:
              schema:
                type: integer
            X-WP-TotalPages:
              schema:
                type: integer
            X-WP-CurrentPage:
              schema:
                type: integer
            X-WP-PageSize:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

    post:
      operationId: createPost
      summary: 建立文章
      tags: [Post]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePostResponse'
        '500':
          description: 建立失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deletePosts
      summary: 批次刪除文章
      tags: [Post]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteByIdsRequest'
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByIdsResponse'
        '500':
          description: 刪除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/sort:
    post:
      operationId: sortPosts
      summary: 排序文章
      tags: [Post]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortRequest'
      responses:
        '200':
          description: 排序成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /posts/{id}:
    get:
      operationId: getPost
      summary: 查詢單一文章
      tags: [Post]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: meta_keys[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: depth
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功回傳文章
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '500':
          description: 文章不存在或 id 格式錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: updatePost
      summary: 更新文章
      tags: [Post]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateByIdResponse'
        '500':
          description: id 格式錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deletePost
      summary: 刪除單一文章
      tags: [Post]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByIdResponse'
        '500':
          description: id 格式錯誤或刪除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{id}/field/{fieldName}:
    get:
      operationId: getPostField
      summary: 查詢文章指定欄位值
      tags: [Post]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: fieldName
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z_-]+$'
            example: post_title
      responses:
        '200':
          description: 成功回傳欄位值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFieldResponse'
        '500':
          description: 文章不存在或欄位名為空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /copy/{id}:
    post:
      operationId: copyPost
      summary: 複製文章（含子文章）
      tags: [Post]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 複製成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyResponse'
        '500':
          description: id 不存在或非數字
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─────────────────────────────────────────
  # Products
  # ─────────────────────────────────────────

  /products:
    get:
      operationId: getProducts
      summary: 查詢商品列表
      tags: [Product]
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [publish, draft, pending, private, trash]
          style: form
          explode: true
        - name: posts_per_page
          in: query
          schema:
            type: integer
            example: 20
        - name: paged
          in: query
          schema:
            type: integer
            example: 1
        - name: orderby
          in: query
          schema:
            type: string
            example: date
        - name: order
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            example: DESC
        - name: meta_keys[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: partials[]
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: 成功回傳商品列表
          headers:
            X-WP-Total:
              schema:
                type: integer
            X-WP-TotalPages:
              schema:
                type: integer
            X-WP-CurrentPage:
              schema:
                type: integer
            X-WP-PageSize:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      operationId: createOrUpdateProducts
      summary: 建立商品 / 批次更新商品（action=update-many）
      tags: [Product]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
        '500':
          description: 建立失敗或 ids 為空（update-many）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteProducts
      summary: 批次刪除商品
      tags: [Product]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProductsRequest'
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByIdsResponse'
        '500':
          description: 商品不存在或刪除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/select:
    get:
      operationId: getProductsSelect
      summary: 查詢商品選擇器（輕量列表）
      tags: [Product]
      parameters:
        - name: s
          in: query
          schema:
            type: string
          description: 搜尋字串；若為數字則以商品 ID 查詢
        - name: post__in[]
          in: query
          schema:
            type: array
            items:
              type: integer
          description: 強制包含指定 ID 的商品
        - name: posts_per_page
          in: query
          schema:
            type: integer
            example: 20
      responses:
        '200':
          description: 成功回傳商品選擇器列表
          headers:
            X-WP-Total:
              schema:
                type: integer
            X-WP-TotalPages:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSelectItem'

  /products/options:
    get:
      operationId: getProductOptions
      summary: 查詢商品選項（分類、標籤、熱銷等）
      tags: [Product]
      responses:
        '200':
          description: 成功回傳商品選項
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOptions'

  /products/bind-items:
    post:
      operationId: bindItemsToProducts
      summary: 綁定權限項目到商品
      tags: [Product]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BindItemsRequest'
      responses:
        '200':
          description: 綁定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindItemsResponse'
        '400':
          description: 缺少必要參數
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/unbind-items:
    post:
      operationId: unbindItemsFromProducts
      summary: 解除綁定項目
      tags: [Product]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnbindItemsRequest'
      responses:
        '200':
          description: 解除綁定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindItemsResponse'
        '400':
          description: 缺少必要參數
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/update-bound-items:
    post:
      operationId: updateBoundItems
      summary: 更新已綁定項目的 limit 設定
      tags: [Product]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BindItemsRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindItemsResponse'

  /products/{id}:
    get:
      operationId: getProduct
      summary: 查詢單一商品
      tags: [Product]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: partials[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: meta_keys[]
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: 成功回傳商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '500':
          description: 商品不存在或 id 格式錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: updateProduct
      summary: 更新商品
      tags: [Product]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateByIdResponse'
        '500':
          description: 商品不存在或 id 格式錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteProduct
      summary: 刪除單一商品
      tags: [Product]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceDeleteRequest'
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByIdResponse'
        '500':
          description: 商品不存在或刪除失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/attributes/{id}:
    post:
      operationId: updateProductAttributes
      summary: 更新商品屬性
      tags: [Product]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateProductAttributesRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateByIdResponse'
        '500':
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/create-variations/{id}:
    post:
      operationId: createProductVariations
      summary: 產生商品變體（依屬性組合自動建立）
      tags: [Product]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 產生成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVariationsResponse'
        '500':
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/update-variations/{id}:
    post:
      operationId: updateProductVariations
      summary: 更新商品變體資料及預設屬性
      tags: [Product]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateVariationsRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─────────────────────────────────────────
  # Orders
  # ─────────────────────────────────────────

  /orders:
    get:
      operationId: getOrders
      summary: 查詢訂單列表
      tags: [Order]
      parameters:
        - name: status[]
          in: query
          schema:
            type: array
            items:
              type: string
          description: WooCommerce 訂單狀態（如 wc-processing）
        - name: limit
          in: query
          schema:
            type: integer
            example: 30
        - name: paged
          in: query
          schema:
            type: integer
            example: 1
        - name: customer_id
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            example: shop_order
        - name: orderby
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
      responses:
        '200':
          description: 成功回傳訂單列表
          headers:
            X-WP-Total:
              schema:
                type: integer
            X-WP-TotalPages:
              schema:
                type: integer
            X-WP-CurrentPage:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      operationId: createOrder
      summary: 建立訂單（初始狀態 pending）
      tags: [Order]
      responses:
        '200':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'

    delete:
      operationId: deleteOrders
      summary: 批次刪除訂單
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteByIdsRequest'
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByIdsResponse'
        '500':
