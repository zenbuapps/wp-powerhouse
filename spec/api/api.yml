# ─────────────────────────────────────────
# Components
# ─────────────────────────────────────────

components:

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 101

    TaxonomyPath:
      name: taxonomy
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
        example: product_cat

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: error_code
        message:
          type: string
          example: 操作失敗的原因

    SuccessResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          nullable: true

    DeleteByIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
          example: [101, 102]

    DeleteByIdsResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          example: delete_success
        message:
          type: string
        data:
          type: array
          items:
            type: integer

    DeleteByIdResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          example: delete_success
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer

    UpdateByIdResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          example: update_success
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer

    ForceDeleteRequest:
      type: object
      properties:
        force_delete:
          type: boolean
          default: false

    SortRequest:
      type: object
      required: [from_tree, to_tree]
      properties:
        from_tree:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
        to_tree:
          type: array
          items:
            type: object
            properties:
              id:
                type: string

    # ---- Settings ----

    PowerhouseSettings:
      type: object
      properties:
        enable_manual_send_email:
          type: string
          enum: [yes, no]
          default: no
        enable_captcha_login:
          type: string
          enum: [yes, no]
          default: no
        captcha_role_list:
          type: array
          items:
            type: string
          example: [administrator]
        enable_captcha_register:
          type: string
          enum: [yes, no]
          default: no
        enable_email_domain_check_register:
          type: string
          enum: [yes, no]
          default: yes
        enable_email_domain_check_wp_mail:
          type: string
          enum: [yes, no]
          default: yes
        email_domain_check_white_list:
          type: array
          items:
            type: string
          example: [gmail.com, yahoo.com]
        delay_email:
          type: string
          enum: [yes, no]
          default: yes
        last_name_optional:
          type: string
          enum: [yes, no]
          default: yes
        theme:
          type: string
          example: power
        enable_theme_changer:
          type: string
          enum: [yes, no]
          default: no
        enable_theme:
          type: string
          enum: [yes, no]
          default: yes
        theme_css:
          type: object
          additionalProperties: true
        api_booster_rules:
          type: array
          items:
            type: object
        api_booster_rule_recipes:
          type: array
          items:
            type: object
        bunny_library_id:
          type: string
        bunny_cdn_hostname:
          type: string
        bunny_stream_api_key:
          type: string

